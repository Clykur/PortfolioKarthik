<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" fill="none">
  <defs>
    <linearGradient id="goldGradient" gradientUnits="userSpaceOnUse" x1="20" y1="16" x2="180" y2="230">
      <stop offset="0%" stop-color="#FCE59F"/>
      <stop offset="20%" stop-color="#DEB259"/>
      <stop offset="45%" stop-color="#B88328"/>
      <stop offset="72%" stop-color="#E2B85E"/>
      <stop offset="90%" stop-color="#9E6914"/>
      <stop offset="100%" stop-color="#7A4D0A"/>
    </linearGradient>
    <clipPath id="boundaryClip">
      <rect x="0" y="16" width="200" height="208"/>
    </clipPath>
  </defs>

  <rect width="180" height="180" rx="38" fill="#101114"/>

  <g transform="translate(90, 90) scale(0.68) translate(-98, -120)" clip-path="url(#boundaryClip)">

    <!-- 1. Central Vertical Stem: x=98, runs from top edge y=16 down past baseline y=224 -->
    <line x1="98" y1="16" x2="98" y2="230" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 2. Top Horizontal Bar: from overhang x=60 to stem x=98 -->
    <line x1="60" y1="22" x2="98" y2="22" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="square"/>

    <!-- 3. Diagonal Brace under top bar -->
    <line x1="62" y1="22" x2="98" y2="58" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 4. Left Arc (Shield): sweeps from top overhang down to baseline -->
    <path d="M 60 22 C 44 42, 24 100, 24 162 C 24 188, 27 210, 29 230" 
          stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 5. Upper-Left Diagonal of K: from (34, 34) into stem junction (98, 98) -->
    <line x1="34" y1="34" x2="102" y2="102" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 6. Lower-Left Diagonal of K: from junction down-left -->
    <line x1="102" y1="94" x2="52" y2="198" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 7. 'R' Upper Loop: from stem across, around 180 deg, and returning horizontally to waistline -->
    <path d="M 98 22 L 138 22 C 164 22, 178 38, 178 60 C 178 82, 164 98, 138 98 L 98 98" 
          stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- 8. 'R' Right Leg: from junction down-right to baseline -->
    <line x1="94" y1="94" x2="178" y2="230" stroke="url(#goldGradient)" stroke-width="12.0" stroke-linecap="butt"/>

    <!-- 9. Central Junction anchor -->
    <circle cx="98" cy="98" r="7.5" fill="url(#goldGradient)"/>

  </g>
</svg>